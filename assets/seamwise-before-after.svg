<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc">
  <title id="title">Task splitting compared with Seamwise</title>
  <desc id="desc">A flat list keeps activities but loses architecture. Seamwise makes boundaries, ownership, capability states, dependencies, and proof explicit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset=".55" stop-color="#091827"/>
      <stop offset="1" stop-color="#07111c"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141e2b"/>
      <stop offset="1" stop-color="#0d1621"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcff"/>
      <stop offset="1" stop-color="#e9f1f8"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31d892"/>
      <stop offset=".5" stop-color="#73d8ff"/>
      <stop offset="1" stop-color="#a987ff"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#24435a" stroke-width="1" opacity=".22"/>
      <circle cx="0" cy="0" r="1.8" fill="#416781" opacity=".3"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#00040a" flood-opacity=".5"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#223c51" flood-opacity=".22"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#73d8ff" flood-opacity=".85"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1774" height="887" fill="#071421"/>
  <rect width="1774" height="887" fill="url(#grid)"/>

  <g font-family="Arial">
    <text x="887" y="67" fill="#7e9db4" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="4">SAME DELIVERY INTENT · DIFFERENT INFORMATION QUALITY</text>
    <text x="887" y="116" fill="#f4f8fb" font-size="34" font-weight="700" text-anchor="middle">Smaller work should not mean a smaller system model.</text>

    <g filter="url(#shadow)">
      <rect x="70" y="158" width="690" height="614" rx="32" fill="#0f1d2b" stroke="#57738a" stroke-width="2"/>
      <rect x="1014" y="158" width="690" height="614" rx="32" fill="#f2f7fb" stroke="#adc1cf" stroke-width="2"/>
    </g>

    <text x="112" y="205" fill="#f2ad45" font-size="14" font-weight="700" letter-spacing="2">TASK SPLITTING</text>
    <text x="112" y="247" fill="#ffffff" font-size="28" font-weight="700">The activities survive.</text>
    <text x="112" y="278" fill="#8faabd" font-size="17">The architecture becomes somebody else's guess.</text>
    <line x1="112" y1="306" x2="718" y2="306" stroke="#334d61"/>

    <g filter="url(#soft)" font-size="19" font-weight="700" fill="#dce8ef">
      <rect x="112" y="346" width="242" height="76" rx="16" fill="#17293a" stroke="#58748a"/><text x="148" y="392">Add schema</text>
      <rect x="474" y="346" width="244" height="76" rx="16" fill="#17293a" stroke="#58748a"/><text x="510" y="392">Add endpoint</text>
      <rect x="292" y="466" width="244" height="76" rx="16" fill="#17293a" stroke="#58748a"/><text x="328" y="512">Add tests</text>
      <rect x="112" y="586" width="242" height="76" rx="16" fill="#17293a" stroke="#58748a"/><text x="148" y="632">Update docs</text>
      <rect x="474" y="586" width="244" height="76" rx="16" fill="#17293a" stroke="#58748a"/><text x="510" y="632">Add metrics</text>
    </g>

    <g fill="none" stroke="#617d91" stroke-width="2" stroke-dasharray="7 10" opacity=".6">
      <path d="M354 384H474"/>
      <path d="M596 422C596 455 536 450 536 504"/>
      <path d="M292 504C230 504 233 552 233 586"/>
      <path d="M536 504C596 504 596 552 596 586"/>
    </g>
    <g fill="#f2ad45">
      <circle cx="414" cy="384" r="6"/><circle cx="579" cy="451" r="6"/><circle cx="264" cy="546" r="6"/><circle cx="566" cy="546" r="6"/>
    </g>

    <g font-size="13" font-weight="700">
      <rect x="112" y="688" width="116" height="36" rx="18" fill="#332514" stroke="#f2ad45"/><text x="170" y="711" fill="#ffd27b" text-anchor="middle">OWNER?</text>
      <rect x="246" y="688" width="112" height="36" rx="18" fill="#332514" stroke="#f2ad45"/><text x="302" y="711" fill="#ffd27b" text-anchor="middle">ORDER?</text>
      <rect x="376" y="688" width="112" height="36" rx="18" fill="#332514" stroke="#f2ad45"/><text x="432" y="711" fill="#ffd27b" text-anchor="middle">PROOF?</text>
      <text x="718" y="711" fill="#e0b765" text-anchor="end">Readable list. Hidden system.</text>
    </g>

    <g transform="translate(887 452)">
      <path d="M-42 -170L10 -104V104L-42 170Z" fill="#0b2132" stroke="url(#seam)" stroke-width="3"/>
      <path d="M42 -170L-10 -104V104L42 170Z" fill="#0b2132" stroke="url(#seam)" stroke-width="3"/>
      <circle cx="0" cy="0" r="9" fill="#73d8ff" filter="url(#glow)"/>
      <text x="0" y="212" fill="#dce9f1" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">SEAMWISE</text>
      <text x="0" y="238" fill="#7999af" font-size="13" text-anchor="middle">evidence + refutation</text>
    </g>

    <text x="1056" y="205" fill="#218666" font-size="14" font-weight="700" letter-spacing="2">SYSTEM-AWARE WORK</text>
    <text x="1056" y="247" fill="#102435" font-size="28" font-weight="700">The work gets smaller.</text>
    <text x="1056" y="278" fill="#60798a" font-size="17">The boundaries, order, and proof remain explicit.</text>
    <line x1="1056" y1="306" x2="1662" y2="306" stroke="#cbd8e1"/>

    <g fill="#61798a" font-size="12" font-weight="700" letter-spacing="1.2">
      <text x="1084" y="338">SYSTEM JOINT</text><text x="1252" y="338">OWNER</text><text x="1380" y="338">CAPABILITY STATE</text><text x="1595" y="338">PROOF</text>
    </g>

    <g filter="url(#soft)">
      <rect x="1056" y="358" width="606" height="72" rx="16" fill="#ffffff" stroke="#72d8af"/>
      <rect x="1056" y="446" width="606" height="72" rx="16" fill="#ffffff" stroke="#72c5f5"/>
      <rect x="1056" y="534" width="606" height="72" rx="16" fill="#ffffff" stroke="#aa91ed"/>
      <rect x="1056" y="622" width="606" height="72" rx="16" fill="#ffffff" stroke="#e6b663"/>
    </g>
    <g stroke="#d6e1e8"><path d="M1228 358V694"/><path d="M1354 358V694"/><path d="M1564 358V694"/></g>

    <g font-size="14" font-weight="700">
      <text x="1080" y="400" fill="#177552">Policy contract</text><text x="1252" y="400" fill="#244156">Contract</text><text x="1378" y="400" fill="#536d7f">Schema is valid</text>
      <text x="1080" y="488" fill="#176791">Resolution</text><text x="1252" y="488" fill="#244156">Policy</text><text x="1378" y="488" fill="#536d7f">Policy resolves</text>
      <text x="1080" y="576" fill="#6048a2">Enforcement</text><text x="1252" y="576" fill="#244156">Request</text><text x="1378" y="576" fill="#536d7f">101 is denied</text>
      <text x="1080" y="664" fill="#8c6024">Visibility</text><text x="1252" y="664" fill="#244156">Telemetry</text><text x="1378" y="664" fill="#536d7f">Reason is visible</text>
    </g>

    <g>
      <rect x="1588" y="376" width="44" height="36" rx="10" fill="#e9f9f2" stroke="#54c998"/>
      <rect x="1588" y="464" width="44" height="36" rx="10" fill="#e7f6ff" stroke="#59b8ec"/>
      <rect x="1588" y="552" width="44" height="36" rx="10" fill="#f0ebff" stroke="#9c7ce8"/>
      <rect x="1588" y="640" width="44" height="36" rx="10" fill="#fff4df" stroke="#dfa64d"/>
      <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1599 394L1607 402L1621 386" stroke="#2bb47f"/><path d="M1599 482L1607 490L1621 474" stroke="#329fd6"/>
        <path d="M1599 570L1607 578L1621 562" stroke="#7e5fc8"/><path d="M1599 658L1607 666L1621 650" stroke="#ca8d2d"/>
      </g>
    </g>

    <g transform="translate(70 808)">
      <text x="0" y="0" fill="#7897ad" font-size="14" font-weight="700" letter-spacing="1.5">FLAT</text>
      <text x="70" y="0" fill="#d8e5ed" font-size="16">architecture implicit · concurrency guessed · done subjective</text>
      <line x1="778" y1="-8" x2="846" y2="-8" stroke="url(#seam)" stroke-width="3"/>
      <text x="900" y="0" fill="#78d9b2" font-size="14" font-weight="700" letter-spacing="1.5">SEAMWISE</text>
      <text x="1024" y="0" fill="#d8e5ed" font-size="16">boundaries explicit · dependencies proven · evals runnable</text>
    </g>
  </g>
</svg>
