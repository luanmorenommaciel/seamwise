<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1774"
  height="887"
  viewBox="0 0 1774 887"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Flat backlog compared with Seamwise decomposition</title>
  <desc id="desc">
    The same rate-limiting outcome appears on the left as a flat activity list
    and on the right as evidence-backed seams, owning lanes, capability legs,
    dependencies, and proof-bearing Task-Specs.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d" />
      <stop offset="0.5" stop-color="#0b1725" />
      <stop offset="1" stop-color="#07101a" />
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c2b" />
      <stop offset="1" stop-color="#0c1420" />
    </linearGradient>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcff" />
      <stop offset="1" stop-color="#e9f1f8" />
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39dfa0" />
      <stop offset="0.5" stop-color="#5bbaff" />
      <stop offset="1" stop-color="#a987ff" />
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#29435b" stroke-width="1" opacity="0.23" />
      <circle cx="0" cy="0" r="2" fill="#496a84" opacity="0.3" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00050c" flood-opacity="0.48" />
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#274054" flood-opacity="0.2" />
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feFlood flood-color="#59c4ff" flood-opacity="0.8" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4db6ff" />
    </marker>
  </defs>

  <rect width="1774" height="887" fill="url(#background)" />
  <rect width="1774" height="887" fill="url(#grid)" />
  <path d="M887 88 V803" stroke="#3c5e77" stroke-width="1.5" opacity="0.55" />

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="438" y="78" fill="#eaf3f8" font-size="28" font-weight="760" text-anchor="middle" letter-spacing="4">FLAT BACKLOG</text>
    <text x="438" y="112" fill="#7f9cb1" font-size="18" text-anchor="middle">Activities are readable. The system model is missing.</text>
    <text x="1336" y="78" fill="#eaf3f8" font-size="28" font-weight="760" text-anchor="middle" letter-spacing="4">SEAMWISE</text>
    <text x="1336" y="112" fill="#7f9cb1" font-size="18" text-anchor="middle">The work gets smaller without losing its architecture.</text>

    <!-- Left panel -->
    <g filter="url(#shadow)">
      <rect x="72" y="150" width="726" height="618" rx="30" fill="url(#leftPanel)" stroke="#506b82" stroke-width="2" />
    </g>
    <g fill="#8ba3b5" font-size="14" font-weight="700" letter-spacing="2">
      <text x="112" y="196">FEATURE</text>
    </g>
    <text x="112" y="235" fill="#ffffff" font-size="25" font-weight="740">Organization-level rate limiting</text>
    <line x1="112" y1="262" x2="758" y2="262" stroke="#354a5c" />

    <g filter="url(#softShadow)">
      <rect x="112" y="298" width="280" height="78" rx="15" fill="#172537" stroke="#52708a" />
      <rect x="478" y="298" width="280" height="78" rx="15" fill="#172537" stroke="#52708a" />
      <rect x="190" y="406" width="280" height="78" rx="15" fill="#172537" stroke="#52708a" />
      <rect x="470" y="514" width="240" height="78" rx="15" fill="#172537" stroke="#52708a" />
      <rect x="112" y="622" width="240" height="78" rx="15" fill="#172537" stroke="#52708a" />
    </g>
    <g font-size="19" font-weight="650">
      <text x="147" y="345" fill="#d7e3eb">Add schema</text>
      <text x="513" y="345" fill="#d7e3eb">Add endpoint</text>
      <text x="225" y="453" fill="#d7e3eb">Add tests</text>
      <text x="505" y="561" fill="#d7e3eb">Update docs</text>
      <text x="147" y="669" fill="#d7e3eb">Add metrics</text>
    </g>
    <g fill="none" stroke="#667f92" stroke-width="2" stroke-dasharray="6 8" opacity="0.6">
      <path d="M392 337 C435 337 438 337 478 337" />
      <path d="M618 376 C618 406 470 391 470 445" />
      <path d="M470 445 C525 445 505 514 590 514" />
      <path d="M330 484 C330 568 232 570 232 622" />
    </g>
    <g fill="#f5b84c">
      <circle cx="406" cy="337" r="5" />
      <circle cx="618" cy="391" r="5" />
      <circle cx="492" cy="464" r="5" />
      <circle cx="330" cy="535" r="5" />
    </g>
    <g transform="translate(112 721)">
      <circle cx="13" cy="13" r="13" fill="#3a2814" stroke="#f2ad45" />
      <path d="M13 6 V14 M13 19 V20" stroke="#ffd27b" stroke-width="2.5" stroke-linecap="round" />
      <text x="38" y="19" fill="#e7bf76" font-size="15">
        Ownership, causal order, integration proof, and safe parallelism are implicit.
      </text>
    </g>

    <!-- Transformation gate -->
    <g transform="translate(887 444)">
      <path d="M-28 -198 L28 -135 V135 L-28 198 Z" fill="#0d2234" stroke="url(#gate)" stroke-width="3" />
      <path d="M-9 -151 L12 -126 V126 L-9 151 Z" fill="#4db6ff" opacity="0.1" />
      <circle cx="0" cy="0" r="9" fill="#75d6ff" filter="url(#glow)" />
      <text x="0" y="241" fill="#88a8bd" font-size="13" text-anchor="middle" letter-spacing="1.5">EVIDENCE + REFUTATION</text>
    </g>
    <path d="M798 444 H848" stroke="#4db6ff" stroke-width="3" marker-end="url(#arrow)" />
    <path d="M926 444 H976" stroke="#4db6ff" stroke-width="3" marker-end="url(#arrow)" />

    <!-- Right panel -->
    <g filter="url(#shadow)">
      <rect x="976" y="150" width="726" height="618" rx="30" fill="url(#rightPanel)" stroke="#afc2d0" stroke-width="2" />
    </g>
    <g fill="#61798a" font-size="13" font-weight="760" letter-spacing="1.8">
      <text x="1012" y="193">SEAM</text>
      <text x="1207" y="193">OWNING LANE</text>
      <text x="1419" y="193">CAPABILITY LEGS</text>
      <text x="1622" y="193" text-anchor="middle">PROOF</text>
    </g>

    <!-- Structured rows -->
    <g filter="url(#softShadow)">
      <rect x="1008" y="218" width="658" height="112" rx="18" fill="#ffffff" stroke="#86dcbc" />
      <rect x="1008" y="344" width="658" height="112" rx="18" fill="#ffffff" stroke="#86cfff" />
      <rect x="1008" y="470" width="658" height="112" rx="18" fill="#ffffff" stroke="#bba0ff" />
      <rect x="1008" y="596" width="658" height="112" rx="18" fill="#ffffff" stroke="#f0c97e" />
    </g>
    <g stroke="#d7e1e8">
      <path d="M1192 218 V330 M1405 218 V330 M1573 218 V330" />
      <path d="M1192 344 V456 M1405 344 V456 M1573 344 V456" />
      <path d="M1192 470 V582 M1405 470 V582 M1573 470 V582" />
      <path d="M1192 596 V708 M1405 596 V708 M1573 596 V708" />
    </g>
    <g font-size="16" font-weight="730">
      <text x="1033" y="263" fill="#166c4e">Policy / config</text>
      <text x="1033" y="389" fill="#176791">Enforcement</text>
      <text x="1033" y="515" fill="#6048a2">Metering</text>
      <text x="1033" y="641" fill="#8c6024">Observability</text>
    </g>
    <g fill="#244156" font-size="15" font-weight="650">
      <text x="1216" y="263">Policy lane</text>
      <text x="1216" y="389">Enforcement lane</text>
      <text x="1216" y="515">Data lane</text>
      <text x="1216" y="641">Telemetry lane</text>
    </g>
    <g fill="#536d7e" font-size="14">
      <text x="1427" y="250">Schema</text>
      <text x="1427" y="276">Policy resolution</text>
      <text x="1427" y="376">Sync enforcement</text>
      <text x="1427" y="402">Degraded behavior</text>
      <text x="1427" y="502">Atomic recording</text>
      <text x="1427" y="528">Decision telemetry</text>
      <text x="1427" y="628">Metrics / logs</text>
      <text x="1427" y="654">Operational proof</text>
    </g>

    <g>
      <rect x="1596" y="240" width="44" height="44" rx="11" fill="#e7f9f1" stroke="#54c998" />
      <rect x="1596" y="366" width="44" height="44" rx="11" fill="#e7f6ff" stroke="#59b8ec" />
      <rect x="1596" y="492" width="44" height="44" rx="11" fill="#f0ebff" stroke="#9c7ce8" />
      <rect x="1596" y="618" width="44" height="44" rx="11" fill="#fff4df" stroke="#dfa64d" />
      <path d="M1608 261 L1616 269 L1630 253" fill="none" stroke="#2bb47f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M1608 387 L1616 395 L1630 379" fill="none" stroke="#329fd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M1608 513 L1616 521 L1630 505" fill="none" stroke="#7e5fc8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M1608 639 L1616 647 L1630 631" fill="none" stroke="#ca8d2d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g fill="#5e7483" font-size="12" text-anchor="middle">
      <text x="1618" y="314">Task-Spec</text>
      <text x="1618" y="440">Task-Spec</text>
      <text x="1618" y="566">Task-Spec</text>
      <text x="1618" y="692">Task-Spec</text>
    </g>

    <!-- Right-side steel thread -->
    <path d="M1450 276 C1515 295 1515 354 1450 376 C1388 398 1388 480 1450 502 C1515 524 1515 606 1450 628" fill="none" stroke="#4db6ff" stroke-width="3" stroke-dasharray="8 8" opacity="0.65" />
    <text x="1336" y="744" fill="#4d6778" font-size="14" font-weight="650" text-anchor="middle">
      Structure → coordination → progression → independently provable work
    </text>

    <g transform="translate(72 805)">
      <text x="815" y="0" fill="#cfe0eb" font-size="22" font-weight="700" text-anchor="middle">
        Same delivery intent. Preserved architecture.
      </text>
      <text x="815" y="32" fill="#7e9baf" font-size="15" text-anchor="middle">
        Seamwise does not split work by convenience. It lowers meaning through evidence-backed system joints.
      </text>
    </g>
  </g>
</svg>
