<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc">
  <title id="title">Seamwise lowering chain</title>
  <desc id="desc">Delivery intent and evidence pass through seam mapping, an ownership plan, explicit review, a dependency graph, and proof-bearing unsealed Task-Specs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="0.55" stop-color="#091827"/>
      <stop offset="1" stop-color="#07111c"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31d892"/>
      <stop offset="0.35" stop-color="#73d8ff"/>
      <stop offset="0.68" stop-color="#a987ff"/>
      <stop offset="1" stop-color="#f2ad45"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11283a"/>
      <stop offset="1" stop-color="#0b1b2a"/>
    </linearGradient>
    <linearGradient id="finalCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e8f1f8"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#24435a" stroke-width="1" opacity=".22"/>
      <circle cx="0" cy="0" r="1.8" fill="#416781" opacity=".3"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#00040a" flood-opacity=".52"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feFlood flood-color="#73d8ff" flood-opacity=".8"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#79d9ff"/>
    </marker>
  </defs>

  <rect width="1774" height="887" fill="#071421"/>
  <rect width="1774" height="887" fill="url(#grid)"/>
  <circle cx="271" cy="447" r="300" fill="#133450" opacity=".12"/>
  <circle cx="1508" cy="447" r="310" fill="#243052" opacity=".1"/>

  <g font-family="Arial">
    <text x="76" y="76" fill="#80a2ba" font-size="18" font-weight="700" letter-spacing="4">THE LOWERING CHAIN</text>
    <text x="76" y="126" fill="#f4f8fb" font-size="35" font-weight="700">From delivery intent to proof-bearing work.</text>
    <text x="1698" y="78" fill="#66869d" font-size="15" text-anchor="end" letter-spacing="2">ONE COMPILER · ONE SOURCE OF TRUTH</text>
    <text x="76" y="164" fill="#91acbf" font-size="18">Boundaries, ownership, causality, and proof survive every transformation.</text>

    <path d="M126 455H1644" fill="none" stroke="#173a50" stroke-width="14" stroke-linecap="round"/>
    <path d="M126 455H1644" fill="none" stroke="url(#rail)" stroke-width="3" stroke-linecap="round" opacity=".92"/>

    <g filter="url(#shadow)">
      <rect x="76" y="312" width="244" height="286" rx="30" fill="#0d2030" stroke="#31d892" stroke-width="2.5"/>
      <rect x="380" y="338" width="238" height="234" rx="26" fill="#0d2030" stroke="#50c9d9" stroke-width="2.5"/>
      <rect x="678" y="338" width="238" height="234" rx="26" fill="#0d2030" stroke="#8e86ff" stroke-width="2.5"/>
      <rect x="1088" y="338" width="238" height="234" rx="26" fill="#0d2030" stroke="#64b9ff" stroke-width="2.5"/>
      <rect x="1386" y="312" width="312" height="286" rx="30" fill="#f2f7fb" stroke="#f2ad45" stroke-width="2.5"/>
    </g>

    <g>
      <circle cx="198" cy="362" r="18" fill="#31d892" opacity=".18"/>
      <circle cx="198" cy="362" r="7" fill="#3be5a0"/>
      <text x="116" y="414" fill="#80a2ba" font-size="14" font-weight="700" letter-spacing="2">INPUT</text>
      <text x="116" y="454" fill="#ffffff" font-size="26" font-weight="700">Delivery intent</text>
      <text x="116" y="486" fill="#ffffff" font-size="26" font-weight="700">+ evidence</text>
      <line x1="116" y1="516" x2="280" y2="516" stroke="#34566d"/>
      <text x="116" y="548" fill="#91acbf" font-size="15">outcome · constraints</text>
      <text x="116" y="573" fill="#91acbf" font-size="15">source · freshness · hash</text>
    </g>

    <g>
      <text x="420" y="390" fill="#78cbd7" font-size="13" font-weight="700" letter-spacing="2">01 · FIND</text>
      <text x="420" y="438" fill="#ffffff" font-size="26" font-weight="700">Seam map</text>
      <text x="420" y="477" fill="#9bb4c6" font-size="16">Defensible system</text>
      <text x="420" y="502" fill="#9bb4c6" font-size="16">joints, not folders.</text>
      <rect x="420" y="528" width="122" height="4" rx="2" fill="#50c9d9"/>
    </g>

    <g>
      <text x="718" y="390" fill="#a79fff" font-size="13" font-weight="700" letter-spacing="2">02 · FORM</text>
      <text x="718" y="438" fill="#ffffff" font-size="26" font-weight="700">Delivery plan</text>
      <text x="718" y="477" fill="#9bb4c6" font-size="16">One owner. Observable</text>
      <text x="718" y="502" fill="#9bb4c6" font-size="16">capability states.</text>
      <rect x="718" y="528" width="122" height="4" rx="2" fill="#a987ff"/>
    </g>

    <g transform="translate(999 455)">
      <path d="M0 -65L54 0L0 65L-54 0Z" fill="#2e2518" stroke="#f2ad45" stroke-width="2.5" filter="url(#shadow)"/>
      <circle cx="0" cy="0" r="8" fill="#ffd27b" filter="url(#glow)"/>
      <text x="0" y="92" fill="#f1c876" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">EXPLICIT REVIEW</text>
      <text x="0" y="115" fill="#829fb3" font-size="13" text-anchor="middle">never inferred</text>
    </g>

    <g>
      <text x="1128" y="390" fill="#7bc8ff" font-size="13" font-weight="700" letter-spacing="2">03 · ORDER</text>
      <text x="1128" y="438" fill="#ffffff" font-size="26" font-weight="700">Task graph</text>
      <text x="1128" y="477" fill="#9bb4c6" font-size="16">Dependencies, contention,</text>
      <text x="1128" y="502" fill="#9bb4c6" font-size="16">and safe concurrency.</text>
      <rect x="1128" y="528" width="122" height="4" rx="2" fill="#64b9ff"/>
    </g>

    <g>
      <text x="1428" y="366" fill="#8c6024" font-size="13" font-weight="700" letter-spacing="2">04 · PROVE</text>
      <text x="1428" y="415" fill="#102435" font-size="28" font-weight="700">Task-Specs</text>
      <text x="1428" y="454" fill="#526d7f" font-size="16">Scope · behavior · evals</text>
      <text x="1428" y="481" fill="#526d7f" font-size="16">dependencies · rollback</text>
      <line x1="1428" y1="510" x2="1656" y2="510" stroke="#c8d7e1"/>
      <text x="1428" y="544" fill="#2e8e68" font-size="14" font-weight="700">VALIDATED</text>
      <text x="1656" y="544" fill="#9a5f17" font-size="14" font-weight="700" text-anchor="end">UNSEALED</text>
    </g>

    <g fill="none" stroke="#79d9ff" stroke-width="2.4" marker-end="url(#arrow)">
      <path d="M320 455H366"/>
      <path d="M618 455H664"/>
      <path d="M916 455H931"/>
      <path d="M1067 455H1074"/>
      <path d="M1326 455H1372"/>
    </g>

    <g transform="translate(76 680)">
      <rect width="1622" height="132" rx="24" fill="#0b1d2b" stroke="#294a60"/>
      <text x="34" y="38" fill="#7295ad" font-size="13" font-weight="700" letter-spacing="2">TRUST RAIL · EACH GATE RECHECKS THE CHAIN</text>
      <g font-size="16" font-weight="700">
        <rect x="34" y="61" width="250" height="44" rx="12" fill="#102a2b" stroke="#31d892"/><text x="58" y="89" fill="#cdeee0">Source hashes</text>
        <rect x="310" y="61" width="250" height="44" rx="12" fill="#10273a" stroke="#73d8ff"/><text x="334" y="89" fill="#d6edfa">Review receipt</text>
        <rect x="586" y="61" width="250" height="44" rx="12" fill="#221e39" stroke="#a987ff"/><text x="610" y="89" fill="#e7ddff">Projection lineage</text>
        <rect x="862" y="61" width="250" height="44" rx="12" fill="#302619" stroke="#f2ad45"/><text x="886" y="89" fill="#f6e0bb">Proof boundaries</text>
      </g>
      <text x="1588" y="82" fill="#dce9f1" font-size="17" font-weight="700" text-anchor="end">Fail closed when truth is missing.</text>
      <text x="1588" y="105" fill="#7694a8" font-size="14" text-anchor="end">Models propose. Evidence and authority decide.</text>
    </g>
  </g>
</svg>
