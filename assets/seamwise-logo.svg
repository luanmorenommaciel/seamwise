<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">Seamwise logo</title>
  <desc id="desc">The Seamwise plate-and-seam mark beside the SEAMWISE wordmark.</desc>
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#24435a" stroke-width="1" opacity=".18"/>
    </pattern>
    <filter id="glow" x="-200%" y="-50%" width="500%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1120" height="280" rx="28" fill="#06111d"/>
  <rect width="1120" height="280" rx="28" fill="url(#grid)"/>
  <g transform="translate(60 20)">
    <path d="M120 42V198" stroke="#73d8ff" stroke-width="3" stroke-linecap="round" opacity=".72" filter="url(#glow)"/>
    <path d="M48 66L104 44V194L48 174Z" fill="#f4f8fb"/>
    <path d="M136 66L192 44V174L136 194Z" fill="#f4f8fb"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#f4f8fb" font-size="72" font-weight="500">
      <text x="330" y="164">S</text>
      <text x="402" y="164">E</text>
      <text x="470" y="164">A</text>
      <text x="544" y="164">M</text>
      <text x="630" y="164">W</text>
      <text x="722" y="164">I</text>
      <text x="766" y="164">S</text>
      <text x="838" y="164">E</text>
    </g>
    <text x="334" y="208" fill="#7f9bb0" font-size="15" font-weight="700" letter-spacing="2.5">FIND THE JOINTS · PRESERVE THE SYSTEM</text>
  </g>
</svg>
