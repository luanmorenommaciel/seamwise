# Credential-free portability gate. It needs no secrets and no other repository,
# so it runs on forks and proves the same test suite on Linux, macOS, and Windows.
name: portable

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Seamwise with its development tools
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff format --check src tests scripts
          python -m ruff check src tests scripts

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

      - name: Doctor
        run: seamwise --json doctor --host core
